<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="hsl(220 70% 50%)" />
    <title>Offline | Menaxheri</title>
    <style>
      :root {
        color-scheme: dark;
        --background: hsl(235 60% 12%);
        --card: hsl(224 43% 16% / 0.92);
        --foreground: hsl(0 0% 100%);
        --muted: hsl(215 28% 74%);
        --border: hsl(220 58% 24%);
        --primary: hsl(220 70% 50%);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, hsl(220 70% 50% / 0.22), transparent 38%),
          var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(100%, 480px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px;
        background: var(--card);
        box-shadow: 0 24px 80px hsl(235 70% 4% / 0.45);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin-bottom: 18px;
        border-radius: 22px;
        background: hsl(220 70% 50% / 0.16);
        border: 1px solid hsl(220 70% 50% / 0.3);
        font-size: 28px;
      }

      h1 { margin: 0 0 10px; font-size: clamp(1.8rem, 5vw, 2.4rem); }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      a, button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: var(--primary);
        color: white;
      }
      .secondary {
        background: transparent;
        color: var(--foreground);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="badge">⚡</div>
      <h1>You're offline</h1>
      <p>Menaxheri is not connected right now. You can reopen the app once your connection returns, or keep using cached screens that were already loaded before.</p>
      <div class="actions">
        <button class="primary" onclick="window.location.reload()">Try again</button>
        <a class="secondary" href="/">Go home</a>
      </div>
    </main>
  </body>
</html>
