# Pulse AI — gitleaks configuration
# Reference: https://github.com/gitleaks/gitleaks#configuration
# NOTE: No allowlist for any credential pattern.
# Commit 66b599f contained revoked credentials on a side branch. The CI scan
# is now scoped to HEAD ancestry (--log-opts="HEAD") so unrelated branch history
# is not scanned. Approved false positives on the HEAD lineage are suppressed
# via .gitleaksignore fingerprints.
title = "Pulse AI Secret Scanner"

[extend]
# Use the full gitleaks default ruleset as the baseline
useDefault = true

[allowlist]
description = "Lock files contain high-entropy hashes — not credentials"
paths = [
  "package-lock\\.json",
  "bun\\.lock",
]
# NO regex allowlist — any token-shaped string in source is a real finding.

# ── Supabase-specific detection rules (additional, not suppressive) ────────
[[rules]]
id          = "supabase-legacy-jwt"
description = "Supabase legacy service_role or anon JWT committed to source"
regex       = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+"
keywords    = ["eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"]
severity    = "critical"
tags        = ["supabase", "jwt", "credential"]

[[rules]]
id          = "supabase-mgmt-token"
description = "Supabase Management API Access Token (sbp_...)"
regex       = "sbp_[A-Za-z0-9_\\-]{20,}"
keywords    = ["sbp_"]
severity    = "critical"
tags        = ["supabase", "management-token", "credential"]

[[rules]]
id          = "supabase-secret-key"
description = "Supabase New Secret API Key (sb_secret_...)"
regex       = "sb_secret_[A-Za-z0-9_\\-]{20,}"
keywords    = ["sb_secret_"]
severity    = "critical"
tags        = ["supabase", "secret-key", "credential"]
