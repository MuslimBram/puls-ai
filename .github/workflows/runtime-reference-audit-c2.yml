name: Runtime Reference Audit C2

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/runtime-reference-audit-c2.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Audit remaining runtime references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Runtime reference audit C2'
            echo '## named platform references'
            grep -RniE --exclude-dir=.git --exclude='runtime-reference-audit-c2.txt' --exclude='runtime-reference-audit.txt' --exclude='runtime-ai-context-audit.txt' --exclude='runtime-reference-audit-c2.yml' 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|api\.lovable\.dev|lovable\.app|lovableproject|@lovable\.dev|lovable_mcp|mcp\.lovable\.dev|x-lovable-' . || true
          } > runtime-reference-audit-c2.txt
          rm -f .github/workflows/runtime-reference-audit-c2.yml
      - name: Commit audit
        shell: bash
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "chore: record remaining runtime references"
          git push origin HEAD:refactor/platform-independent-runtime
