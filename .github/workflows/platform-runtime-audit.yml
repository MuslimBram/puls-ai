name: Platform Runtime Audit

on:
  push:
    branches:
      - fix/remove-lovable-runtime-dependency
    paths:
      - .github/workflows/platform-runtime-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-lovable-runtime-dependency
          fetch-depth: 0

      - name: Capture remaining references
        shell: bash
        run: |
          {
            echo "# Remaining platform-specific references"
            echo
            echo "## Case-insensitive Lovable references excluding lockfiles"
            git grep -n -i "lovable" -- ':!package-lock.json' ':!bun.lock' || true
            echo
            echo "## Gateway references"
            git grep -n "ai.gateway.lovable.dev" || true
            echo
            echo "## Legacy API key references"
            git grep -n "LOVABLE_API_KEY" || true
            echo
            echo "## Package references"
            git grep -n "@lovable.dev" -- ':!package-lock.json' ':!bun.lock' || true
          } > platform-runtime-audit.txt
          rm .github/workflows/platform-runtime-audit.yml

      - name: Commit audit snapshot
        shell: bash
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture runtime migration audit"
          git push origin HEAD:fix/remove-lovable-runtime-dependency
