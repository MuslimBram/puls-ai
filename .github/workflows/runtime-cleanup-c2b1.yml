name: Runtime Cleanup C2B1

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/runtime-cleanup-c2b1.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Migrate registration and withdrawal AI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def matching(s, oi):
              d=0; i=oi
              while i<len(s):
                  c=s[i]
                  if c in ('"',"'",'`'):
                      q=c; i+=1
                      while i<len(s):
                          if s[i]=='\\': i+=2; continue
                          if s[i]==q: i+=1; break
                          i+=1
                      continue
                  if c=='/' and i+1<len(s) and s[i+1]=='/':
                      i+=2
                      while i<len(s) and s[i]!='\n': i+=1
                      continue
                  if c=='/' and i+1<len(s) and s[i+1]=='*':
                      e=s.find('*/',i+2); i=len(s) if e<0 else e+2; continue
                  if c=='(': d+=1
                  elif c==')':
                      d-=1
                      if d==0:return i
                  i+=1
              raise RuntimeError('unbalanced')

          def replace_fetch(t, context):
              urls=['https://ai.gateway.lovable.dev/v1/chat/completions','https://api.lovable.dev/v1/chat/completions']
              hits=[(t.find(f'await fetch("{u}", '),u) for u in urls]
              hits=[h for h in hits if h[0]>=0]
              if not hits: raise RuntimeError('direct fetch not found')
              st,u=min(hits)
              fo=t.find('(',st+len('await fetch')); fc=matching(t,fo)
              call=t[st:fc+1]; marker='body: JSON.stringify('; bp=call.find(marker)
              if bp<0: raise RuntimeError('body not found')
              so=bp+len('body: JSON.stringify'); sc=matching(call,so)
              body=call[so+1:sc]
              return t[:st]+f'await routerChatCompletion({body}, {context})'+t[fc+1:]

          def add_import(t):
              if 'router-chat-compat.ts' in t:return t
              lines=t.splitlines(True); pos=0
              for i,l in enumerate(lines):
                  if l.startswith('import '):pos=i+1
              lines.insert(pos,'import { routerChatCompletion } from "../_shared/router-chat-compat.ts";\n')
              return ''.join(lines)

          p=Path('supabase/functions/ai-registration-check/index.ts'); t=add_import(p.read_text())
          t=re.sub(r'^\s*const LOVABLE_API_KEY = Deno\.env\.get\("LOVABLE_API_KEY"\);\s*\n','',t,flags=re.M)
          t=t.replace('    // AI analysis via Lovable AI','    // AI analysis via canonical Pulse AI router')
          t=t.replace('    if (LOVABLE_API_KEY) {','    {')
          t=replace_fetch(t,'{ taskType: "balanced", allowInternalNoWorkspace: true }')
          p.write_text(t)

          p=Path('supabase/functions/withdrawal-fraud-check/index.ts'); t=add_import(p.read_text())
          t=re.sub(r'^const LOVABLE_API_KEY = Deno\.env\.get\("LOVABLE_API_KEY"\) \?\? "";\n','',t,flags=re.M)
          t=replace_fetch(t,'{ authHeader, userId: wr.user_id, taskType: "balanced" }')
          p.write_text(t)

          Path('.github/workflows/runtime-cleanup-c2b1.yml').unlink(missing_ok=True)
          PY
      - name: Assert
        run: |
          ! grep -E 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|api\.lovable\.dev' supabase/functions/ai-registration-check/index.ts
          ! grep -E 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|api\.lovable\.dev' supabase/functions/withdrawal-fraud-check/index.ts
          grep -q routerChatCompletion supabase/functions/ai-registration-check/index.ts
          grep -q routerChatCompletion supabase/functions/withdrawal-fraud-check/index.ts
      - name: Commit
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route registration and withdrawal analysis"
          git push origin HEAD:refactor/platform-independent-runtime
