name: Runtime Cleanup C2B3

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/runtime-cleanup-c2b3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Migrate competitor AI analysis
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def matching(s, oi):
              d=0; i=oi
              while i<len(s):
                  c=s[i]
                  if c in ('"',"'",'`'):
                      q=c; i+=1
                      while i<len(s):
                          if s[i]=='\\': i+=2; continue
                          if s[i]==q: i+=1; break
                          i+=1
                      continue
                  if c=='/' and i+1<len(s) and s[i+1]=='/':
                      i+=2
                      while i<len(s) and s[i]!='\n': i+=1
                      continue
                  if c=='/' and i+1<len(s) and s[i+1]=='*':
                      e=s.find('*/',i+2); i=len(s) if e<0 else e+2; continue
                  if c=='(': d+=1
                  elif c==')':
                      d-=1
                      if d==0:return i
                  i+=1
              raise RuntimeError('unbalanced')

          def replace_one(t, context, start_at=0):
              needle='await fetch("https://ai.gateway.lovable.dev/v1/chat/completions", '
              st=t.find(needle,start_at)
              if st<0: raise RuntimeError('direct fetch not found')
              fo=t.find('(',st+len('await fetch')); fc=matching(t,fo)
              call=t[st:fc+1]; bp=call.find('body: JSON.stringify(')
              if bp<0: raise RuntimeError('body not found')
              so=bp+len('body: JSON.stringify'); sc=matching(call,so); body=call[so+1:sc]
              repl=f'await routerChatCompletion({body}, {context})'
              return t[:st]+repl+t[fc+1:], st+len(repl)

          p=Path('supabase/functions/analyze-competitor/index.ts'); t=p.read_text()
          if 'router-chat-compat.ts' not in t:
              lines=t.splitlines(True); pos=0
              for i,l in enumerate(lines):
                  if l.startswith('import '):pos=i+1
              lines.insert(pos,'import { routerChatCompletion } from "../_shared/router-chat-compat.ts";\n')
              t=''.join(lines)

          t=re.sub(r'^\s*const LOVABLE_API_KEY = Deno\.env\.get\("LOVABLE_API_KEY"\);\s*\n','',t,flags=re.M)
          t=re.sub(r'^\s*if \(!LOVABLE_API_KEY\) throw new Error\([^\n]*\);\s*\n','',t,flags=re.M)
          t=t.replace('            supabase, comp, FIRECRAWL_API_KEY!, LOVABLE_API_KEY\n', '            supabase, comp, FIRECRAWL_API_KEY!\n')
          t=t.replace('        supabase, competitor, FIRECRAWL_API_KEY, LOVABLE_API_KEY\n', '        supabase, competitor, FIRECRAWL_API_KEY\n')
          t=t.replace('  firecrawlKey: string,\n  lovableKey: string\n)', '  firecrawlKey: string\n)')

          t,pos=replace_one(t,'{ workspaceId: competitor.workspace_id || profile?.workspace_id || undefined, userId: userId || undefined, authHeader, taskType: "web_research", allowInternalNoWorkspace: !authHeader && !(competitor.workspace_id || profile?.workspace_id) }')
          t,pos=replace_one(t,'{ workspaceId: competitor.workspace_id || undefined, userId: competitor.user_id, taskType: "web_research", allowInternalNoWorkspace: !competitor.workspace_id }',pos)

          if 'LOVABLE_API_KEY' in t or 'lovableKey' in t or 'ai.gateway.lovable.dev' in t:
              raise RuntimeError('legacy competitor reference remains')
          p.write_text(t)
          Path('.github/workflows/runtime-cleanup-c2b3.yml').unlink(missing_ok=True)
          PY
      - name: Assert
        run: |
          grep -q routerChatCompletion supabase/functions/analyze-competitor/index.ts
          ! grep -E 'LOVABLE_API_KEY|lovableKey|ai\.gateway\.lovable\.dev' supabase/functions/analyze-competitor/index.ts
      - name: Commit
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route competitor intelligence through canonical AI"
          git push origin HEAD:refactor/platform-independent-runtime
