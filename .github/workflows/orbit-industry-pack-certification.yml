name: Orbit Industry Pack Certification

on:
  pull_request:
    paths:
      - "src/components/OrbitSelector.tsx"
      - "src/components/OrbitSelector.test.tsx"
      - "src/components/marketplace/IndustryPackOrbitSelector.tsx"
      - "src/components/marketplace/IndustryPackOrbitSelector.test.tsx"
      - "src/pages/Marketplace.tsx"
      - ".github/workflows/orbit-industry-pack-certification.yml"

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Orbit and industry-pack targeted tests
        run: npx vitest run src/components/OrbitSelector.test.tsx src/components/marketplace/IndustryPackOrbitSelector.test.tsx
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
