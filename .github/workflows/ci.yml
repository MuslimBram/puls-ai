name: Pulse AI Production CI/CD Release Gate

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Lint, Test, Validate, Build
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint check
        run: npx eslint .

      - name: Run Vitest test suite
        run: npx vitest run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate SQL Migrations Syntax & Sequence
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql'));
          console.log('Validating ' + files.length + ' SQL migration files...');
          let lastVersion = '';
          for (const f of files.sort()) {
            const version = f.split('_')[0];
            if (version < lastVersion) {
              console.error('Migration order anomaly: ' + f);
              process.exit(1);
            }
            lastVersion = version;
          }
          console.log('Migration sequence valid.');
          "

      - name: Build Vite Production Bundle
        run: npm run build
