name: Pulse AI Production CI/CD Release Gate

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks full-history v8.30.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Canary Test (Verify Gitleaks Detection Capability)
        run: |
          mkdir -p /tmp/canary_dir
          echo "sbp_0000000000000000000000000000000000000000" > /tmp/canary_dir/canary.txt
          docker run --rm -v /tmp/canary_dir:/canary -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:v8.30.0 detect --no-git --config /repo/.gitleaks.toml --source /canary/canary.txt > /tmp/canary.log 2>&1 || true
          if grep -q "leaks found" /tmp/canary.log || grep -q "Finding:" /tmp/canary.log || grep -q "WRN" /tmp/canary.log; then
            echo "CANARY_DETECTED: YES — Gitleaks scanner operational."
            rm -rf /tmp/canary_dir /tmp/canary.log
          else
            echo "::error::CANARY DETECT FAILED — Gitleaks scanner failed to detect synthetic credential!"
            cat /tmp/canary.log
            rm -rf /tmp/canary_dir /tmp/canary.log
            exit 1
          fi

      - name: Full-history Gitleaks Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/path ghcr.io/gitleaks/gitleaks:v8.30.0 git --redact --verbose --log-opts="--all" --config /path/.gitleaks.toml /path

  build-and-test:
    name: Lint, Test, Validate, Build
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint check
        run: npx eslint .

      - name: Run Vitest test suite
        run: npx vitest run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate SQL Migrations Syntax & Sequence
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql'));
          console.log('Validating ' + files.length + ' SQL migration files...');
          let lastVersion = '';
          for (const f of files.sort()) {
            const version = f.split('_')[0];
            if (version < lastVersion) {
              console.error('Migration order anomaly: ' + f);
              process.exit(1);
            }
            lastVersion = version;
          }
          console.log('Migration sequence valid.');
          "

      - name: Build Vite Production Bundle
        run: npm run build
