name: Pulse AI Production CI/CD Release Gate

on:
  push:
    branches: [ main, feature/*, refactor/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  runtime-migration:
    name: One-shot platform-independent runtime migration
    if: (github.event_name == 'pull_request' && github.head_ref == 'refactor/platform-independent-runtime') || (github.event_name == 'push' && github.ref == 'refs/heads/refactor/platform-independent-runtime')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0

      - name: Replace image runtime and secure worker trigger
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          worker = Path('supabase/functions/job-worker/index.ts')
          t = worker.read_text(encoding='utf-8')
          t = t.replace('const AI_GATEWAY_URL = "https://ai.gateway.lovable.dev/v1/chat/completions";\n', '')
          t = t.replace('const DEFAULT_IMAGE_MODEL = "google/gemini-3.1-flash-image-preview";\n', 'const REPLICATE_DEFAULT_IMAGE_MODEL = "black-forest-labs/flux-schnell";\n')

          branch_start = t.find('  if (generation.media_type === "image") {')
          branch_end_marker = '\n\n  throw new Error(`Unsupported media type ${generation.media_type}`);'
          branch_end = t.find(branch_end_marker, branch_start)
          if branch_start < 0 or branch_end < 0:
              raise RuntimeError('image dispatch branch not found')
          t = t[:branch_start] + '''  if (generation.media_type === "image") {
    return await processConfiguredImageGeneration(supabase, generation, provider);
  }''' + t[branch_end:]

          video_marker = 'async function processConfiguredVideoGeneration(supabase: any, generation: any, provider: any): Promise<JobOutcome> {'
          insert_at = t.find(video_marker)
          if insert_at < 0:
              raise RuntimeError('video handler marker missing')

          handlers = r'''async function processConfiguredImageGeneration(supabase: any, generation: any, provider: any): Promise<JobOutcome> {
  const providerConfig = toRecord(provider.config);
  const adapter = String(providerConfig.adapter ?? provider.provider_key);
  if (adapter !== "replicate" && adapter !== "replicate-image") {
    throw new Error(`No registered runtime handler for image provider ${provider.provider_key}`);
  }
  return await processReplicateImageGeneration(supabase, generation, provider, providerConfig);
}

async function processReplicateImageGeneration(
  supabase: any,
  generation: any,
  provider: any,
  providerConfig: Record<string, unknown>,
): Promise<JobOutcome> {
  const token = await resolveProviderSecret(supabase, provider);
  if (!token) throw new Error(`No credential available for image provider ${provider.provider_key}`);

  const model = String(providerConfig.model ?? REPLICATE_DEFAULT_IMAGE_MODEL);
  const promptField = String(providerConfig.prompt_field ?? "prompt");
  const inputDefaults = toRecord(providerConfig.input_defaults);
  const predictionOptions = toRecord(providerConfig.prediction_options);
  const metadata = toRecord(generation.metadata);

  if (!generation.provider_job_id) {
    const input: Record<string, unknown> = { ...inputDefaults, [promptField]: generation.prompt };
    const createResponse = await fetch(`${REPLICATE_API_URL}/models/${model}/predictions`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
        Accept: "application/json",
      },
      body: JSON.stringify({ ...predictionOptions, input }),
      signal: AbortSignal.timeout(30000),
    });
    const bodyText = await createResponse.text();
    if (!createResponse.ok) throw new Error(`Replicate image create failed [${createResponse.status}]: ${bodyText}`);
    const created = safeJsonParse(bodyText);
    const providerJobId = String(created?.id ?? "");
    if (!providerJobId) throw new Error("Replicate did not return an image prediction id");

    await supabase.from("media_generations").update({
      provider_job_id: providerJobId,
      status: "generating",
      updated_at: new Date().toISOString(),
      metadata: { ...metadata, adapter: "replicate-image", model, prediction_status: created?.status ?? "starting", input_payload: input },
    }).eq("id", generation.id);

    if (created?.status === "succeeded") {
      const resultUrl = extractReplicateOutputUrl(created?.output);
      if (resultUrl) {
        const persistentUrl = await persistRemoteImage(supabase, generation, resultUrl);
        await finalizeMediaGenerationSuccess(supabase, generation, {
          providerKey: provider.provider_key,
          resultUrl: persistentUrl,
          providerJobId,
          metadata: { ...metadata, adapter: "replicate-image", model, prediction_status: "succeeded", completed_by: WORKER_ID, output_kind: "image" },
        });
        return { status: "completed" };
      }
    }
    return { status: "deferred", nextRetryAt: new Date(Date.now() + 6000).toISOString(), message: "Replicate image prediction started" };
  }

  const pollResponse = await fetch(`${REPLICATE_API_URL}/predictions/${generation.provider_job_id}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
    signal: AbortSignal.timeout(30000),
  });
  const bodyText = await pollResponse.text();
  if (!pollResponse.ok) throw new Error(`Replicate image polling failed [${pollResponse.status}]: ${bodyText}`);
  const prediction = safeJsonParse(bodyText);
  const status = String(prediction?.status ?? "processing");

  if (["starting", "processing"].includes(status)) {
    await supabase.from("media_generations").update({
      status: "generating",
      updated_at: new Date().toISOString(),
      metadata: { ...metadata, adapter: "replicate-image", model, prediction_status: status },
    }).eq("id", generation.id);
    return { status: "deferred", nextRetryAt: new Date(Date.now() + 6000).toISOString(), message: `Replicate image status: ${status}` };
  }
  if (["failed", "canceled"].includes(status)) throw new Error(String(prediction?.error ?? `Replicate image prediction ${status}`));
  if (status !== "succeeded") return { status: "deferred", nextRetryAt: new Date(Date.now() + 6000).toISOString(), message: `Replicate image status: ${status}` };

  const resultUrl = extractReplicateOutputUrl(prediction?.output);
  if (!resultUrl) throw new Error("Replicate did not return a usable image URL");
  const persistentUrl = await persistRemoteImage(supabase, generation, resultUrl);
  await finalizeMediaGenerationSuccess(supabase, generation, {
    providerKey: provider.provider_key,
    resultUrl: persistentUrl,
    providerJobId: generation.provider_job_id,
    metadata: { ...metadata, adapter: "replicate-image", model, prediction_status: status, completed_by: WORKER_ID, output_kind: "image" },
  });
  return { status: "completed" };
}

async function persistRemoteImage(supabase: any, generation: any, remoteUrl: string) {
  const response = await fetch(remoteUrl, { signal: AbortSignal.timeout(30000) });
  if (!response.ok) throw new Error(`Failed to download generated image [${response.status}]`);
  const contentType = response.headers.get("content-type")?.split(";")[0]?.trim() || "image/png";
  const extension = contentType === "image/jpeg" ? "jpg" : contentType === "image/webp" ? "webp" : "png";
  const filePath = `${generation.user_id}/${generation.id}.${extension}`;
  const bytes = new Uint8Array(await response.arrayBuffer());
  const { error: uploadError } = await supabase.storage.from("generated-media").upload(filePath, bytes, { contentType, upsert: true });
  if (uploadError) throw uploadError;
  return supabase.storage.from("generated-media").getPublicUrl(filePath).data.publicUrl;
}

'''
          t = t[:insert_at] + handlers + t[insert_at:]

          old_start = t.find('async function processLovableImageGeneration(')
          final_marker = 'async function finalizeMediaGenerationSuccess('
          old_end = t.find(final_marker, old_start)
          if old_start < 0 or old_end < 0:
              raise RuntimeError('legacy image function not found')
          t = t[:old_start] + t[old_end:]

          if 'LOVABLE_API_KEY' in t or 'ai.gateway.lovable.dev' in t or 'processLovableImageGeneration' in t:
              raise RuntimeError('legacy image runtime reference remains')
          worker.write_text(t, encoding='utf-8')

          media = Path('supabase/functions/generate-media/index.ts')
          m = media.read_text(encoding='utf-8')
          old = '''    const workerUrl = `${Deno.env.get("SUPABASE_URL")}/functions/v1/job-worker`;
    const anonKey = Deno.env.get("SUPABASE_ANON_KEY");

    if (anonKey) {
      fetch(workerUrl, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${anonKey}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ source: "generate-media", businessId: businessProfile.id }),
      }).catch((error) => console.error("Failed to trigger job-worker", error));
    }
'''
          new = '''    const workerUrl = `${Deno.env.get("SUPABASE_URL")}/functions/v1/job-worker`;
    const cronSecret = Deno.env.get("CRON_SECRET");

    if (cronSecret) {
      fetch(workerUrl, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${cronSecret}`,
          "x-cron-secret": cronSecret,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ source: "generate-media", businessId: businessProfile.id }),
      }).catch((error) => console.error("Failed to trigger job-worker", error));
    } else {
      console.error("CRON_SECRET not configured; media job remains queued for scheduled worker processing");
    }
'''
          if old not in m:
              raise RuntimeError('generate-media worker trigger block not found')
          media.write_text(m.replace(old, new), encoding='utf-8')

          Path('.github/workflows/media-runtime-migration-v2.yml').unlink(missing_ok=True)
          Path('.github/workflows/email-queue-migration-v2.yml').unlink(missing_ok=True)
          Path('runtime-reference-audit-c3.txt').unlink(missing_ok=True)
          PY

      - name: Restore canonical CI workflow in branch
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit migration and CI restoration
        shell: bash
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete platform-independent media runtime"
          git push origin HEAD:refactor/platform-independent-runtime

  secret-scan:
    name: Secret Scanning (gitleaks full-history v8.30.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Canary Test (Verify Gitleaks Detection Capability)
        run: |
          mkdir -p /tmp/canary_dir
          P1="sbp_"
          P2="0000000000000000000000000000000000000000"
          printf "%s%s\n" "$P1" "$P2" > /tmp/canary_dir/canary.txt
          docker run --rm -v /tmp/canary_dir:/canary -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:v8.30.0 detect --no-git --config /repo/.gitleaks.toml --source /canary/canary.txt -f json -r /canary/canary-report.json || true
          if [ -f /tmp/canary_dir/canary-report.json ] && grep -q '"RuleID": "supabase-mgmt-token"' /tmp/canary_dir/canary-report.json; then
            echo "CANARY_DETECTED: YES — Gitleaks rule supabase-mgmt-token verified via JSON report."
            rm -rf /tmp/canary_dir
          else
            echo "::error::CANARY DETECT FAILED — Gitleaks scanner failed to detect synthetic credential via JSON report!"
            [ -f /tmp/canary_dir/canary-report.json ] && cat /tmp/canary_dir/canary-report.json
            rm -rf /tmp/canary_dir
            exit 1
          fi

      - name: Full-history Gitleaks Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/path ghcr.io/gitleaks/gitleaks:v8.30.0 git --redact --verbose --log-opts="--all" --config /path/.gitleaks.toml /path

  build-and-test:
    name: Lint, Test, Validate, Build
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint check
        run: npx eslint .

      - name: Run Vitest test suite
        run: npx vitest run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate SQL Migrations Syntax & Sequence
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql'));
          console.log('Validating ' + files.length + ' SQL migration files...');
          let lastVersion = '';
          for (const f of files.sort()) {
            const version = f.split('_')[0];
            if (version < lastVersion) {
              console.error('Migration order anomaly: ' + f);
              process.exit(1);
            }
            lastVersion = version;
          }
          console.log('Migration sequence valid.');
          "

      - name: Build Vite Production Bundle
        run: npm run build
