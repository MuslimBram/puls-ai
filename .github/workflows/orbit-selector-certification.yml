name: Orbit Selector Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/OrbitSelector.tsx'
      - 'src/components/OrbitSelector.test.tsx'
      - 'src/pages/Onboarding.tsx'
      - '.github/workflows/orbit-selector-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OrbitSelector targeted tests
        run: npx vitest run src/components/OrbitSelector.test.tsx

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
