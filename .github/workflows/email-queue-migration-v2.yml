name: Email Queue Migration V2

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/email-queue-migration-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Replace queue delivery call
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def matching(s, oi):
              depth = 0
              i = oi
              while i < len(s):
                  c = s[i]
                  if c in ('"', "'", '`'):
                      q = c; i += 1
                      while i < len(s):
                          if s[i] == '\\': i += 2; continue
                          if s[i] == q: i += 1; break
                          i += 1
                      continue
                  if c == '/' and i + 1 < len(s) and s[i+1] == '/':
                      i += 2
                      while i < len(s) and s[i] != '\n': i += 1
                      continue
                  if c == '/' and i + 1 < len(s) and s[i+1] == '*':
                      end = s.find('*/', i+2); i = len(s) if end < 0 else end + 2; continue
                  if c == '(': depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise RuntimeError('unbalanced call')

          p = Path('supabase/functions/process-email-queue/index.ts')
          t = p.read_text(encoding='utf-8')
          t = t.replace("import { sendLovableEmail } from 'npm:@lovable.dev/email-js'", "import { sendResendEmail } from '../_shared/resend-email.ts'")
          t = t.replace("  const apiKey = Deno.env.get('LOVABLE_API_KEY')\n", "  const resendKey = Deno.env.get('RESEND_API_KEY')\n")
          t = t.replace('if (!apiKey || !supabaseUrl || !supabaseServiceKey)', 'if (!resendKey || !supabaseUrl || !supabaseServiceKey)')

          start = t.find('await sendLovableEmail(')
          if start < 0: raise RuntimeError('send call not found')
          open_idx = t.find('(', start)
          close_idx = matching(t, open_idx)
          replacement = '''const unsubscribeUrl = payload.unsubscribe_token
          ? `${supabaseUrl}/functions/v1/handle-email-unsubscribe?token=${encodeURIComponent(payload.unsubscribe_token)}`
          : null

        const delivery = await sendResendEmail({
          to: payload.to,
          from: payload.from,
          subject: payload.subject,
          html: payload.html,
          text: payload.text,
          idempotencyKey: payload.idempotency_key || payload.message_id,
          headers: unsubscribeUrl ? {
            'List-Unsubscribe': `<${unsubscribeUrl}>`,
            'List-Unsubscribe-Post': 'List-Unsubscribe=One-Click',
          } : undefined,
        })'''
          t = t[:start] + replacement + t[close_idx+1:]

          sent_marker = "          status: 'sent',\n        })"
          if sent_marker in t:
              t = t.replace(sent_marker, "          status: 'sent',\n          metadata: delivery.id ? { provider: 'resend', provider_message_id: delivery.id } : { provider: 'resend' },\n        })", 1)

          if 'sendLovableEmail' in t or '@lovable.dev' in t or 'LOVABLE_' in t or 'api.lovable.dev' in t:
              raise RuntimeError('legacy email reference remains')
          p.write_text(t, encoding='utf-8')
          Path('.github/workflows/email-queue-migration-v2.yml').unlink(missing_ok=True)
          PY
      - name: Assert
        run: |
          grep -q sendResendEmail supabase/functions/process-email-queue/index.ts
          grep -q List-Unsubscribe-Post supabase/functions/process-email-queue/index.ts
          ! grep -E 'sendLovableEmail|@lovable\.dev|LOVABLE_|api\.lovable\.dev' supabase/functions/process-email-queue/index.ts
      - name: Commit
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: deliver queued email with Resend"
          git push origin HEAD:refactor/platform-independent-runtime
