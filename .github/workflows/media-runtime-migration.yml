name: Media Runtime Migration

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/media-runtime-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Replace image runtime with Replicate adapter
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('supabase/functions/job-worker/index.ts')
          text = p.read_text(encoding='utf-8')

          text = text.replace('const AI_GATEWAY_URL = "https://ai.gateway.lovable.dev/v1/chat/completions";\n', '')
          text = text.replace('const DEFAULT_IMAGE_MODEL = "google/gemini-3.1-flash-image-preview";\n', 'const REPLICATE_DEFAULT_IMAGE_MODEL = "black-forest-labs/flux-schnell";\n')

          old_branch = '''  if (generation.media_type === "image") {
    if (provider.provider_key === "lovable-image") {
      await processLovableImageGeneration(supabase, generation, provider);
      return { status: "completed" };
    }

    throw new Error(`No registered runtime handler for image provider ${provider.provider_key}`);
  }
'''
          new_branch = '''  if (generation.media_type === "image") {
    return await processConfiguredImageGeneration(supabase, generation, provider);
  }
'''
          if old_branch not in text:
              raise RuntimeError('image provider branch not found')
          text = text.replace(old_branch, new_branch)

          marker = 'async function processConfiguredVideoGeneration(supabase: any, generation: any, provider: any): Promise<JobOutcome> {'
          if marker not in text:
              raise RuntimeError('video handler marker not found')

          image_handlers = r'''async function processConfiguredImageGeneration(supabase: any, generation: any, provider: any): Promise<JobOutcome> {
  const providerConfig = toRecord(provider.config);
  const adapter = String(providerConfig.adapter ?? provider.provider_key);

  switch (adapter) {
    case "replicate":
    case "replicate-image":
      return await processReplicateImageGeneration(supabase, generation, provider, providerConfig);
    default:
      throw new Error(`No registered runtime handler for image provider ${provider.provider_key}`);
  }
}

async function processReplicateImageGeneration(
  supabase: any,
  generation: any,
  provider: any,
  providerConfig: Record<string, unknown>,
): Promise<JobOutcome> {
  const token = await resolveProviderSecret(supabase, provider);
  if (!token) throw new Error(`No credential available for image provider ${provider.provider_key}`);

  const model = String(providerConfig.model ?? REPLICATE_DEFAULT_IMAGE_MODEL);
  const promptField = String(providerConfig.prompt_field ?? "prompt");
  const inputDefaults = toRecord(providerConfig.input_defaults);
  const predictionOptions = toRecord(providerConfig.prediction_options);
  const metadata = toRecord(generation.metadata);

  if (!generation.provider_job_id) {
    const input: Record<string, unknown> = {
      ...inputDefaults,
      [promptField]: generation.prompt,
    };

    const createResponse = await fetch(`${REPLICATE_API_URL}/models/${model}/predictions`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
        Accept: "application/json",
      },
      body: JSON.stringify({ ...predictionOptions, input }),
      signal: AbortSignal.timeout(30000),
    });

    const createBodyText = await createResponse.text();
    if (!createResponse.ok) {
      throw new Error(`Replicate image create failed [${createResponse.status}]: ${createBodyText}`);
    }

    const created = safeJsonParse(createBodyText);
    const providerJobId = String(created?.id ?? "");
    if (!providerJobId) throw new Error("Replicate did not return an image prediction id");

    await supabase.from("media_generations").update({
      provider_job_id: providerJobId,
      status: "generating",
      updated_at: new Date().toISOString(),
      metadata: {
        ...metadata,
        adapter: "replicate-image",
        model,
        prediction_status: created?.status ?? "starting",
        input_payload: input,
      },
    }).eq("id", generation.id);

    if (created?.status === "succeeded") {
      const immediateUrl = extractReplicateOutputUrl(created?.output);
      if (immediateUrl) {
        const persistentUrl = await persistRemoteImage(supabase, generation, immediateUrl);
        await finalizeMediaGenerationSuccess(supabase, generation, {
          providerKey: provider.provider_key,
          resultUrl: persistentUrl,
          providerJobId,
          metadata: {
            ...metadata,
            adapter: "replicate-image",
            model,
            prediction_status: "succeeded",
            completed_by: WORKER_ID,
            output_kind: "image",
          },
        });
        return { status: "completed" };
      }
    }

    return {
      status: "deferred",
      nextRetryAt: new Date(Date.now() + 6000).toISOString(),
      message: "Replicate image prediction started",
    };
  }

  const pollResponse = await fetch(`${REPLICATE_API_URL}/predictions/${generation.provider_job_id}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
    signal: AbortSignal.timeout(30000),
  });
  const pollBodyText = await pollResponse.text();
  if (!pollResponse.ok) {
    throw new Error(`Replicate image polling failed [${pollResponse.status}]: ${pollBodyText}`);
  }

  const prediction = safeJsonParse(pollBodyText);
  const status = String(prediction?.status ?? "processing");

  if (["starting", "processing"].includes(status)) {
    await supabase.from("media_generations").update({
      status: "generating",
      updated_at: new Date().toISOString(),
      metadata: { ...metadata, adapter: "replicate-image", model, prediction_status: status },
    }).eq("id", generation.id);
    return {
      status: "deferred",
      nextRetryAt: new Date(Date.now() + 6000).toISOString(),
      message: `Replicate image status: ${status}`,
    };
  }

  if (["failed", "canceled"].includes(status)) {
    throw new Error(String(prediction?.error ?? `Replicate image prediction ${status}`));
  }
  if (status !== "succeeded") {
    return {
      status: "deferred",
      nextRetryAt: new Date(Date.now() + 6000).toISOString(),
      message: `Replicate image status: ${status}`,
    };
  }

  const resultUrl = extractReplicateOutputUrl(prediction?.output);
  if (!resultUrl) throw new Error("Replicate did not return a usable image URL");
  const persistentUrl = await persistRemoteImage(supabase, generation, resultUrl);

  await finalizeMediaGenerationSuccess(supabase, generation, {
    providerKey: provider.provider_key,
    resultUrl: persistentUrl,
    providerJobId: generation.provider_job_id,
    metadata: {
      ...metadata,
      adapter: "replicate-image",
      model,
      prediction_status: status,
      completed_by: WORKER_ID,
      output_kind: "image",
    },
  });
  return { status: "completed" };
}

async function persistRemoteImage(supabase: any, generation: any, remoteUrl: string) {
  const response = await fetch(remoteUrl, { signal: AbortSignal.timeout(30000) });
  if (!response.ok) throw new Error(`Failed to download generated image [${response.status}]`);

  const contentType = response.headers.get("content-type")?.split(";")[0]?.trim() || "image/png";
  const extension = contentType === "image/jpeg" ? "jpg" : contentType === "image/webp" ? "webp" : "png";
  const filePath = `${generation.user_id}/${generation.id}.${extension}`;
  const bytes = new Uint8Array(await response.arrayBuffer());

  const { error: uploadError } = await supabase.storage
    .from("generated-media")
    .upload(filePath, bytes, { contentType, upsert: true });
  if (uploadError) throw uploadError;

  const { data } = supabase.storage.from("generated-media").getPublicUrl(filePath);
  return data.publicUrl;
}

'''
          text = text.replace(marker, image_handlers + marker)

          text = re.sub(
              r'async function processLovableImageGeneration\([\s\S]*?\n\}\n\nasync function finalizeMediaGenerationSuccess',
              'async function finalizeMediaGenerationSuccess',
              text,
              count=1,
          )

          if 'LOVABLE_API_KEY' in text or 'ai.gateway.lovable.dev' in text or 'processLovableImageGeneration' in text:
              raise RuntimeError('legacy image runtime reference remains')

          p.write_text(text, encoding='utf-8')
          Path('runtime-reference-audit-c3.txt').unlink(missing_ok=True)
          Path('.github/workflows/media-runtime-migration.yml').unlink(missing_ok=True)
          PY
      - name: Focused assertions
        run: |
          grep -q 'processReplicateImageGeneration' supabase/functions/job-worker/index.ts
          grep -q 'persistRemoteImage' supabase/functions/job-worker/index.ts
          ! grep -E 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|processLovableImageGeneration' supabase/functions/job-worker/index.ts
      - name: Commit
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move image generation to Replicate runtime"
          git push origin HEAD:refactor/platform-independent-runtime
