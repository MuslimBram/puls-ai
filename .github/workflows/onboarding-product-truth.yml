name: Onboarding Product Truth Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/hooks/useOnboardingProgress.ts'
      - 'src/pages/Onboarding.tsx'
      - 'src/factory/__tests__/onboardingProductTruth.test.ts'
      - '.github/workflows/onboarding-product-truth.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Product truth test
        run: npx vitest run src/factory/__tests__/onboardingProductTruth.test.ts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
