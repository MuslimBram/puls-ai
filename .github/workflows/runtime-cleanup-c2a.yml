name: Runtime Cleanup C2A

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/runtime-cleanup-c2a.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Route remaining authenticated text AI callers through canonical router
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROUTER_IMPORT = 'import { routerChatCompletion } from "../_shared/router-chat-compat.ts";\n'
          URLS = (
              'https://ai.gateway.lovable.dev/v1/chat/completions',
              'https://api.lovable.dev/v1/chat/completions',
          )

          def scan_matching_paren(s: str, open_idx: int) -> int:
              assert s[open_idx] == '('
              depth = 0
              i = open_idx
              n = len(s)
              while i < n:
                  ch = s[i]
                  if ch in ('"', "'", '`'):
                      quote = ch
                      i += 1
                      while i < n:
                          if s[i] == '\\':
                              i += 2
                              continue
                          if s[i] == quote:
                              i += 1
                              break
                          i += 1
                      continue
                  if ch == '/' and i + 1 < n and s[i+1] == '/':
                      i += 2
                      while i < n and s[i] != '\n': i += 1
                      continue
                  if ch == '/' and i + 1 < n and s[i+1] == '*':
                      end = s.find('*/', i + 2)
                      i = n if end < 0 else end + 2
                      continue
                  if ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError('unbalanced parentheses')

          def replace_chat_fetches(text: str, context_expr: str) -> tuple[str, int]:
              replaced = 0
              search_from = 0
              while True:
                  candidates = []
                  for url in URLS:
                      needle = f'await fetch("{url}", '
                      pos = text.find(needle, search_from)
                      if pos >= 0: candidates.append((pos, needle))
                  if not candidates: break
                  start, needle = min(candidates, key=lambda x: x[0])
                  fetch_open = text.find('(', start + len('await fetch'))
                  fetch_close = scan_matching_paren(text, fetch_open)
                  call = text[start:fetch_close+1]
                  body_marker = 'body: JSON.stringify('
                  body_pos = call.find(body_marker)
                  if body_pos < 0:
                      raise RuntimeError(f'No JSON.stringify body found near offset {start}')
                  stringify_open = body_pos + len('body: JSON.stringify')
                  stringify_close = scan_matching_paren(call, stringify_open)
                  inner = call[stringify_open+1:stringify_close]
                  replacement = f'await routerChatCompletion({inner}, {context_expr})'
                  text = text[:start] + replacement + text[fetch_close+1:]
                  replaced += 1
                  search_from = start + len(replacement)
              return text, replaced

          def ensure_import(text: str) -> str:
              if 'router-chat-compat.ts' in text:
                  return text
              lines = text.splitlines(True)
              insert_at = 0
              for idx, line in enumerate(lines):
                  if line.startswith('import '): insert_at = idx + 1
              lines.insert(insert_at, ROUTER_IMPORT)
              return ''.join(lines)

          def strip_old_key_lines(text: str) -> str:
              text = re.sub(r'^\s*const LOVABLE_API_KEY = Deno\.env\.get\("LOVABLE_API_KEY"\);\s*\n', '', text, flags=re.M)
              text = re.sub(r'^\s*if \(!LOVABLE_API_KEY\) throw new Error\([^\n]*\);\s*\n', '', text, flags=re.M)
              text = re.sub(r'^\s*const lovableKey = Deno\.env\.get\("LOVABLE_API_KEY"\);\s*\n', '', text, flags=re.M)
              text = re.sub(r'\n\s*if \(!lovableKey\) \{\n\s*return new Response\(JSON\.stringify\(\{ error: "AI key not configured" \}\), \{\n\s*status: 503,\n\s*headers: \{ \.\.\.getCors\(req\), "Content-Type": "application/json" \},\n\s*\}\);\n\s*\}\n', '\n', text)
              text = text.replace('if (markdown.length > 100 && LOVABLE_API_KEY) {', 'if (markdown.length > 100) {')
              return text

          configs = {
            'supabase/functions/seo-audit/index.ts': '{ userId, authHeader, taskType: "web_research" }',
            'supabase/functions/scan-business-content/index.ts': '{ userId, authHeader, taskType: "rag" }',
            'supabase/functions/scan-source-extract/index.ts': '{ workspaceId: workspace_id, userId, authHeader, taskType: "rag" }',
            'supabase/functions/ai-sales-assistant/index.ts': '{ authHeader: req.headers.get("Authorization"), taskType: "sales_reply" }',
            'supabase/functions/generate-campaign/index.ts': '{ workspaceId: campaign_data?.workspace_id || profile?.workspace_id || undefined, userId, authHeader, taskType: "marketing_copy" }',
            'supabase/functions/generate-ai-suggestions/index.ts': '{ workspaceId: workspace_id || bizProfile?.workspace_id || undefined, userId: user_id, authHeader: req.headers.get("Authorization"), taskType: focus === "replies" ? "sales_reply" : focus === "seo" ? "web_research" : "marketing_copy" }',
          }

          for path, context in configs.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = ensure_import(text)
              text = strip_old_key_lines(text)
              if path.endswith('generate-ai-suggestions/index.ts'):
                  text = text.replace('.select("business_name, industry, short_description, target_audience, main_services")', '.select("business_name, industry, short_description, target_audience, main_services, workspace_id")')
              text, count = replace_chat_fetches(text, context)
              if count == 0:
                  raise RuntimeError(f'Expected at least one direct chat fetch in {path}')
              p.write_text(text, encoding='utf-8')

          replacements = {
            'supabase/functions/create-paypal-order/index.ts': ('req.headers.get("origin") || "https://pulsi.lovable.app"', 'req.headers.get("origin") || Deno.env.get("PUBLIC_SITE_URL") || "https://pulse-bos.com"'),
            'supabase/functions/create-checkout/index.ts': ('req.headers.get("origin") || "https://talk-finder-bot.lovable.app"', 'req.headers.get("origin") || Deno.env.get("PUBLIC_SITE_URL") || "https://pulse-bos.com"'),
            'supabase/functions/customer-portal/index.ts': ('req.headers.get("origin") || "https://talk-finder-bot.lovable.app"', 'req.headers.get("origin") || Deno.env.get("PUBLIC_SITE_URL") || "https://pulse-bos.com"'),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text: raise RuntimeError(f'Expected fallback not found in {path}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          Path('runtime-reference-audit-c2.txt').unlink(missing_ok=True)
          Path('runtime-ai-context-audit.txt').unlink(missing_ok=True)
          Path('.github/workflows/runtime-cleanup-c2a.yml').unlink(missing_ok=True)
          PY
      - name: Focused reference assertion
        shell: bash
        run: |
          set -e
          for f in \
            supabase/functions/seo-audit/index.ts \
            supabase/functions/scan-business-content/index.ts \
            supabase/functions/scan-source-extract/index.ts \
            supabase/functions/ai-sales-assistant/index.ts \
            supabase/functions/generate-campaign/index.ts \
            supabase/functions/generate-ai-suggestions/index.ts; do
            ! grep -E 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|api\.lovable\.dev' "$f"
            grep -q 'routerChatCompletion' "$f"
          done
      - name: Commit C2A
        shell: bash
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route additional AI callers through canonical router"
          git push origin HEAD:refactor/platform-independent-runtime
