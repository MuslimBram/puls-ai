name: Email Queue Provider Migration

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/email-queue-provider-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Switch dispatcher to Resend
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/process-email-queue/index.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import { sendLovableEmail } from 'npm:@lovable.dev/email-js'\n", "import { sendResendEmail } from '../_shared/resend-email.ts'\n")
          text = text.replace("  const apiKey = Deno.env.get('LOVABLE_API_KEY')\n", "  const resendKey = Deno.env.get('RESEND_API_KEY')\n")
          text = text.replace('  if (!apiKey || !supabaseUrl || !supabaseServiceKey) {', '  if (!resendKey || !supabaseUrl || !supabaseServiceKey) {')

          old = '''        await sendLovableEmail(
          {
            run_id: payload.run_id,
            to: payload.to,
            from: payload.from,
            sender_domain: payload.sender_domain,
            subject: payload.subject,
            html: payload.html,
            text: payload.text,
            purpose: payload.purpose,
            label: payload.label,
            idempotency_key: payload.idempotency_key,
            unsubscribe_token: payload.unsubscribe_token,
            message_id: payload.message_id,
          },
          // sendUrl is optional — when LOVABLE_SEND_URL is not set, the library
          // falls back to the default Lovable API endpoint (https://api.lovable.dev).
          // Set LOVABLE_SEND_URL as a Supabase secret to override (e.g. for local dev).
          { apiKey, sendUrl: Deno.env.get('LOVABLE_SEND_URL') }
        )'''
          new = '''        const unsubscribeUrl = payload.unsubscribe_token
          ? `${supabaseUrl}/functions/v1/handle-email-unsubscribe?token=${encodeURIComponent(payload.unsubscribe_token)}`
          : null

        const delivery = await sendResendEmail({
          to: payload.to,
          from: payload.from,
          subject: payload.subject,
          html: payload.html,
          text: payload.text,
          idempotencyKey: payload.idempotency_key || payload.message_id,
          headers: unsubscribeUrl ? {
            'List-Unsubscribe': `<${unsubscribeUrl}>`,
            'List-Unsubscribe-Post': 'List-Unsubscribe=One-Click',
          } : undefined,
        })'''
          if old not in text:
              raise RuntimeError('legacy send block not found')
          text = text.replace(old, new)

          # Store provider id when available without changing required schema fields.
          text = text.replace("          status: 'sent',\n        })", "          status: 'sent',\n          metadata: delivery.id ? { provider: 'resend', provider_message_id: delivery.id } : { provider: 'resend' },\n        })", 1)

          if '@lovable.dev' in text or 'LOVABLE_' in text or 'api.lovable.dev' in text:
              raise RuntimeError('legacy email provider reference remains')
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/email-queue-provider-migration.yml').unlink(missing_ok=True)
          PY
      - name: Focused assertions
        run: |
          grep -q sendResendEmail supabase/functions/process-email-queue/index.ts
          grep -q List-Unsubscribe-Post supabase/functions/process-email-queue/index.ts
          ! grep -E '@lovable\.dev|LOVABLE_|api\.lovable\.dev' supabase/functions/process-email-queue/index.ts
      - name: Commit
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "refactor: deliver queued email through Resend"
          git push origin HEAD:refactor/platform-independent-runtime
