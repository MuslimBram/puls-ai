name: Runtime Reference Audit C3

on:
  push:
    branches:
      - refactor/platform-independent-runtime
    paths:
      - .github/workflows/runtime-reference-audit-c3.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/platform-independent-runtime
          fetch-depth: 0
      - name: Audit
        run: |
          {
            echo '# Runtime reference audit C3'
            grep -RniE --exclude-dir=.git --exclude='runtime-reference-audit-c3.txt' --exclude='runtime-reference-audit-c3.yml' 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|api\.lovable\.dev|connector-gateway\.lovable\.dev|lovable\.app|lovableproject|@lovable\.dev|lovable_mcp|mcp\.lovable\.dev|x-lovable-' supabase src package.json README.md docs 2>/dev/null || true
          } > runtime-reference-audit-c3.txt
          rm -f .github/workflows/runtime-reference-audit-c3.yml
      - name: Commit
        run: |
          git config user.name "MuslimBram"
          git config user.email "223172034+MuslimBram@users.noreply.github.com"
          git add -A
          git commit -m "chore: record remaining platform runtime dependencies"
          git push origin HEAD:refactor/platform-independent-runtime
