    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pulse AI — AI-Powered Lead Discovery & Unified Inbox</title>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pulse AI",
      "url": "https://kohablerjeve.top/",
      "logo": "https://kohablerjeve.top/pwa/apple-touch-icon.png",
      "sameAs": ["https://alfis.re/"],
      "description": "AI-native platform unifying inbox, CRM, telephony, and marketing automation for small businesses and freelancers.",

        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://kohablerjeve.top/"
      }
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pulse AI",
      "url": "https://kohablerjeve.top/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://kohablerjeve.top/register?ref={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {"@type":"Question","name":"What is Pulse AI?","acceptedAnswer":{"@type":"Answer","text":"Pulse AI is an all-in-one AI-powered platform for managing leads, customers, marketing, and sales. It unifies your inbox, CRM, telephony, and automation into one dashboard."}},
        {"@type":"Question","name":"How much does Pulse AI cost?","acceptedAnswer":{"@type":"Answer","text":"Plans start at €49/month (Start), €99/month (Growth), €199/month (PRO), and €399+/month (Enterprise). Annual plans and longer commitments unlock significant discounts."}},
        {"@type":"Question","name":"Can I try Pulse AI for free?","acceptedAnswer":{"@type":"Answer","text":"Yes. Every new account gets a 7-day free trial with full access to all features. No credit card required to start."}},
        {"@type":"Question","name":"What channels does Pulse AI support?","acceptedAnswer":{"@type":"Answer","text":"Pulse AI supports WhatsApp Business, Instagram DMs, Facebook Messenger, Email (SMTP/IMAP), Telegram, SMS, and custom webhook channels — all in one unified inbox."}},
        {"@type":"Question","name":"What's the difference between Business, Freelancer, and Ambassador?","acceptedAnswer":{"@type":"Answer","text":"Business owners use Pulse AI to grow their own business with AI tools. Freelancers manage other businesses and earn 35% referral plus 40% management commission. Ambassadors earn 35% lifetime referral commission."}},
        {"@type":"Question","name":"How do I earn money with Pulse AI referrals?","acceptedAnswer":{"@type":"Answer","text":"Share your unique referral link and earn a lifetime commission on every payment made by users you refer. No cap on earnings."}},
        {"@type":"Question","name":"Can I install Pulse AI on my phone?","acceptedAnswer":{"@type":"Answer","text":"Yes. Pulse AI is a Progressive Web App installable directly from your browser on iOS, Android, desktop, and tablet — no app store needed."}},
        {"@type":"Question","name":"What happens after the free trial ends?","acceptedAnswer":{"@type":"Answer","text":"After 7 days you choose a paid plan to continue. Accounts that remain unpaid after a 30-day grace period are deleted. Payments via PayPal, Payoneer, and wallet balance are supported."}},
        {"@type":"Question","name":"Does Pulse AI use AI for replies?","acceptedAnswer":{"@type":"Answer","text":"Yes. Pulse AI reads your business knowledge base and conversation history to suggest context-aware replies in the correct tone. You review and send — the AI never sends automatically unless you set up an automation to do so."}}
      ]
    }
    </script>
